name: release

# Builds installers on GitHub's runners and ships them via GitHub Releases:
#   - workflow_dispatch : manual run, uploads artifacts to the Actions run.
#   - push tag v*       : creates a GitHub Release with all bundles attached.
# The release is created once up front (create-release job) so concurrent
# platform builds upload to it instead of racing on create.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      releaseId: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create release (or reuse existing)
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
            const version = require('./src-tauri/tauri.conf.json').version;
            try {
              const release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: `v${version}`,
                name: `v${version}`,
                body: "See the assets to download and install this version.",
                draft: false,
                prerelease: false
              });
              return release.data.id;
            } catch (e) {
              if (e.status === 422) {
                const existing = await github.rest.repos.getReleaseByTag({
                  owner,
                  repo,
                  tag: `v${version}`
                });
                return existing.data.id;
              }
              throw e;
            }

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest   # msi + nsis (x64)
          - platform: ubuntu-22.04     # deb / rpm / appimage (x64)
          - platform: macos-latest     # dmg (aarch64)
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.releaseId }}
          includeUpdaterJson: true
