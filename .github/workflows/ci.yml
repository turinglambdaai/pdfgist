name: CI
on:
  push:
  pull_request:

jobs:
  racket-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: stable
      - name: Install rivet (upstream main)
        run: raco pkg install --auto --no-docs --skip-installed https://github.com/turinglambdaai/rivet
      - name: Domain core tests
        run: raco test racket/
