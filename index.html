<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDFGist</title>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <button id="btn-open" class="icon-btn" title="打开 PDF（Ctrl+O）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
        </button>
        <input id="file-input" type="file" accept="application/pdf,.pdf" hidden />
        <div class="tool-sep"></div>
        <button id="btn-panel" class="icon-btn" title="缩略图与目录" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
        </button>
        <span id="doc-title" class="doc-title"></span>
        <div class="spacer"></div>
        <div class="tool-group">
          <button id="btn-prev" class="icon-btn" title="上一页" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <span class="page-box">
            <input id="page-input" class="page-input" value="–" disabled spellcheck="false" />
            <span class="page-total">/ <span id="page-total">–</span></span>
          </span>
          <button id="btn-next" class="icon-btn" title="下一页" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
        <div class="tool-sep"></div>
        <div class="tool-group">
          <button id="btn-zoom-out" class="icon-btn" title="缩小" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg>
          </button>
          <button id="btn-zoom-reset" class="zoom-label" title="重置缩放" disabled>100%</button>
          <button id="btn-zoom-in" class="icon-btn" title="放大" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button id="btn-fit" class="icon-btn" title="适应宽度" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>
          </button>
        </div>
        <div class="spacer"></div>
        <button id="btn-find" class="icon-btn" title="搜索（Ctrl+F）" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
        </button>
        <button id="btn-theme" class="icon-btn" title="切换深色 / 浅色">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M17.3 13.7A8.5 8.5 0 0 1 10.3 2.7a.5.5 0 0 0-.6-.6 9.5 9.5 0 1 0 11.2 11.2.5.5 0 0 0-.6-.6 8.4 8.4 0 0 1-3 1z"/></svg>
        </button>
        <div class="tool-sep"></div>
        <button id="btn-sidebar" class="icon-btn text-btn active" title="AI 助手">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2 5.2 5.2 2-5.2 2-2 5.2-2-5.2L4.8 10l5.2-2 2-5.2z"/><path d="M19 14l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1 1-2.6z"/></svg>
          <span>AI 助手</span>
        </button>
      </header>
      <div id="main">
        <aside id="left-panel" class="hidden">
          <div class="panel-tabs">
            <button id="panel-tab-thumbs" class="panel-tab active" title="缩略图">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
            </button>
            <button id="panel-tab-outline" class="panel-tab" title="目录">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
            </button>
          </div>
          <div id="panel-view-thumbs" class="panel-view active">
            <div id="thumbs-grid"></div>
          </div>
          <div id="panel-view-outline" class="panel-view">
            <nav id="outline-tree"></nav>
            <div id="outline-empty" class="panel-empty hidden">本文档没有目录</div>
          </div>
        </aside>
        <div id="viewer-wrap">
          <div id="viewer"></div>
          <div id="findbar" class="hidden">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
            <input id="find-input" placeholder="在文档中搜索…" spellcheck="false" />
            <span id="find-count" class="find-count"></span>
            <button id="find-prev" class="icon-btn" title="上一个（Shift+Enter）">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
            </button>
            <button id="find-next" class="icon-btn" title="下一个（Enter）">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
            </button>
            <button id="find-close" class="icon-btn" title="关闭（Esc）">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          <div id="empty-state">
            <div class="empty-box">
              <div class="empty-logo">PDFGist</div>
              <p class="empty-tagline">接入自己大模型的 AI PDF 阅读器</p>
              <div class="empty-features">
                <div class="empty-feature">
                  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2 5.2 5.2 2-5.2 2-2 5.2-2-5.2L4.8 10l5.2-2 2-5.2z"/></svg>
                  <span>划词翻译 · 一键总结 · 与文档对话</span>
                </div>
                <div class="empty-feature">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
                  <span>全文搜索 · 缩略图导航 · 深色模式</span>
                </div>
                <div class="empty-feature">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-5z"/></svg>
                  <span>OpenAI 协议端点通吃，Key 只存本机</span>
                </div>
              </div>
              <div class="empty-actions">
                <button id="btn-open-empty" class="empty-cta">打开 PDF 文件</button>
                <span class="empty-or">或拖到窗口任意位置</span>
              </div>
              <div class="empty-hints"><kbd>Ctrl+O</kbd> 打开 <kbd>Ctrl+F</kbd> 搜索 <kbd>Ctrl+滚轮</kbd> 缩放 <kbd>划词</kbd> 翻译</div>
            </div>
          </div>
          <div id="drop-overlay" class="hidden">松开以打开 PDF</div>
        </div>
        <aside id="sidebar">
          <div id="update-banner" class="hidden">
            <span id="update-banner-text">发现新版本</span>
            <button id="btn-update-install" class="accent-btn">更新并重启</button>
            <button id="btn-update-dismiss" class="icon-btn small" title="忽略">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          <nav id="sidebar-tabs">
            <button class="tab-btn active" data-tab="translate">翻译</button>
            <button class="tab-btn" data-tab="summarize">总结</button>
            <button class="tab-btn" data-tab="chat">对话</button>
            <button class="tab-btn" data-tab="settings">设置</button>
          </nav>
          <section id="tab-translate" class="tab-panel active">
            <div class="panel-actions">
              <button id="btn-translate-page" class="accent-btn">翻译本页</button>
              <button id="btn-translate-bilingual" class="ghost-btn" title="逐段对照：原文与译文成对显示">段落对照</button>
              <label class="inline-label">译入
                <select id="target-lang"></select>
              </label>
            </div>
            <div id="translate-list" class="card-list"></div>
          </section>
          <section id="tab-summarize" class="tab-panel">
            <div class="panel-actions">
              <button id="btn-sum-page" class="accent-btn">总结本页</button>
              <button id="btn-sum-selection" class="ghost-btn">总结选区</button>
              <button id="btn-sum-doc" class="ghost-btn">总结全文</button>
            </div>
            <div id="summarize-list" class="card-list"></div>
          </section>
          <section id="tab-chat" class="tab-panel">
            <div id="chat-messages" class="chat-messages">
              <div class="chat-hint">基于文档内容提问。上下文范围：
                <select id="chat-scope">
                  <option value="page">当前页</option>
                  <option value="selection">选区</option>
                  <option value="doc">全文（前 12 页）</option>
                </select>
              </div>
            </div>
            <div class="chat-input-row">
              <textarea id="chat-input" rows="2" placeholder="针对文档提问…（Enter 发送，Shift+Enter 换行）"></textarea>
              <div class="chat-buttons">
                <button id="btn-chat-send" class="accent-btn">发送</button>
                <button id="btn-chat-stop" class="ghost-btn hidden">停止</button>
              </div>
            </div>
          </section>
          <section id="tab-settings" class="tab-panel">
            <div class="settings-form">
              <div class="settings-section">
                <div class="settings-section-title">模型服务商</div>
                <label>预设
                  <select id="preset-select"></select>
                </label>
                <label>Base URL
                  <input id="base-url" type="text" spellcheck="false" placeholder="https://api.example.com/v1" />
                </label>
                <label>API Key
                  <input id="api-key" type="password" spellcheck="false" placeholder="sk-…" autocomplete="off" />
                </label>
                <label>模型
                  <div class="model-row">
                    <input id="model-input" type="text" list="model-list" spellcheck="false" />
                    <datalist id="model-list"></datalist>
                    <button id="btn-fetch-models" class="ghost-btn">拉取</button>
                  </div>
                </label>
                <div class="settings-buttons">
                  <button id="btn-save-settings" class="accent-btn">保存设置</button>
                  <button id="btn-test" class="ghost-btn">测试连接</button>
                </div>
                <div id="settings-status" class="settings-status"></div>
              </div>
              <div class="settings-section">
                <div class="settings-section-title">通用</div>
                <label>译入语言
                  <select id="target-lang-settings"></select>
                </label>
              </div>
              <div class="settings-section">
                <div class="settings-section-title">关于与更新</div>
                <div class="update-row">
                  <span>当前版本 <span id="app-version">–</span></span>
                  <button id="btn-check-update" class="ghost-btn">检查更新</button>
                </div>
                <div id="update-status" class="settings-status"></div>
                <p class="settings-note">API Key 仅保存在本机用户配置目录（settings.json），请求由本机直接发往你选择的服务商，不经过任何中间服务器。</p>
              </div>
            </div>
          </section>
        </aside>
      </div>
      <button id="selection-action" class="hidden">翻译</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
